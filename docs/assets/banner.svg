<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="t d">
  <title id="t">host-guard</title>
  <desc id="d">host-guard: one Linux server watched, patched, backed up and proven restorable. Python standard library and systemd, no agent, no bill.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e8eef4"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22a06b"/>
      <stop offset="1" stop-color="#127a4f"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#d5dde6" stroke-width="1"/>
    </pattern>
    <clipPath id="sclip"><path d="M160 58 L238 88 V162 C238 214 204 248 160 266 C116 248 82 214 82 162 V88 Z"/></clipPath>
    <style>
      .h { font: 700 64px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #0f172a; letter-spacing: -1px; }
      .s { font: 400 24px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #334155; }
      .chip { font: 600 15px ui-monospace, 'Cascadia Mono', Consolas, monospace; fill: #0f5132; }
      .tiny { font: 500 14px ui-monospace, 'Cascadia Mono', Consolas, monospace; fill: #64748b; }
      @media (prefers-reduced-motion: reduce) { .anim { display: none; } }
    </style>
  </defs>
  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)" opacity="0.55"/>

  <!-- shield with a scan line passing over it -->
  <circle cx="160" cy="160" r="118" fill="none" stroke="#22a06b" stroke-width="2" opacity="0.35">
    <animate class="anim" attributeName="r" values="112;128;112" dur="4s" repeatCount="indefinite"/>
    <animate class="anim" attributeName="opacity" values="0.45;0.1;0.45" dur="4s" repeatCount="indefinite"/>
  </circle>
  <path d="M160 58 L238 88 V162 C238 214 204 248 160 266 C116 248 82 214 82 162 V88 Z" fill="url(#shield)"/>
  <g clip-path="url(#sclip)">
    <rect class="anim" x="70" y="40" width="180" height="10" fill="#ffffff" opacity="0.35">
      <animate attributeName="y" values="40;270;40" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>
  <path d="M124 160 L150 186 L200 132" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="300" y="132" class="h">host-guard</text>
  <text x="302" y="174" class="s">One Linux server: watched, patched, backed up, proven restorable.</text>
  <text x="302" y="206" class="s">Python standard library and systemd. No agent, no bill.</text>

  <!-- what runs, as chips -->
  <g transform="translate(302 236)">
    <rect width="150" height="32" rx="16" fill="#dcf5e7" stroke="#9fd8b8"/>
    <text x="75" y="21" text-anchor="middle" class="chip">health 5 min</text>
    <rect x="162" width="190" height="32" rx="16" fill="#dcf5e7" stroke="#9fd8b8"/>
    <text x="257" y="21" text-anchor="middle" class="chip">intrusion 5 min</text>
    <rect x="364" width="196" height="32" rx="16" fill="#dcf5e7" stroke="#9fd8b8"/>
    <text x="462" y="21" text-anchor="middle" class="chip">AES-256 backups</text>
    <rect x="572" width="186" height="32" rx="16" fill="#dcf5e7" stroke="#9fd8b8"/>
    <text x="665" y="21" text-anchor="middle" class="chip">restore tests</text>
    <rect x="770" width="176" height="32" rx="16" fill="#dcf5e7" stroke="#9fd8b8"/>
    <text x="858" y="21" text-anchor="middle" class="chip">daily report</text>
  </g>
  <text x="1250" y="300" text-anchor="end" class="tiny">EC2 · any VPS · bare metal</text>
</svg>
