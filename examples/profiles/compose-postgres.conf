# A Docker Compose app with PostgreSQL (for example a web app, a worker and `db`).
#   sudo bash guard/install.sh --profile examples/profiles/compose-postgres.conf \
#        --stack-dir /srv/myapp --domain app.example.com --web-logs /srv/myapp/logs/nginx \
#        --mail-to you@example.com
APP_NAME=My app
HEALTH_PATH=/health
# the Compose service of the web server, stopped by LOCKDOWN=web
WEB_SERVICE=nginx
DB_ENGINE=postgres
DB_SERVICE=db
# pg_dumpall runs inside the db container as this database user
PG_USER=postgres
BACKUP_PREFIX=myapp-db
# the restore test loads the dump into a throwaway container of this image
PG_IMAGE=postgres:17
JAILS=sshd recidive nginx-limit-req web-probe
# Python packages inside these containers are checked against OSV advisories
CONTAINERS_PYTHON=web worker
