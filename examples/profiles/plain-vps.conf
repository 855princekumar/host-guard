# A plain VPS or bare-metal server: no Docker app, maybe a website on the host.
# Health, intrusion watch, early warning, scans, patch window and the daily report
# all work without anything below; the backup keeps /etc and the home folders.
#   sudo bash guard/install.sh --profile examples/profiles/plain-vps.conf --mail-to you@example.com
# Add --domain www.example.com (and --web-logs /var/log/nginx) when the server has a website.
APP_NAME=the website
HEALTH_PATH=/
WEB_SERVICE=nginx
DB_ENGINE=none
# Anything that writes the backup to stdout; it is gzipped and encrypted for you.
# The restore test decrypts and unpacks it completely.
BACKUP_CMD=tar -cf - --exclude=/home/*/.cache /etc /home
BACKUP_PREFIX=server-files
JAILS=sshd recidive nginx-limit-req web-probe
