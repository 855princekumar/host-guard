# A bare-metal or VM server running nginx and MariaDB directly on the host (no Docker).
#   sudo bash guard/install.sh --profile examples/profiles/bare-metal-mariadb.conf \
#        --domain shop.example.com --web-logs /var/log/nginx --mail-to you@example.com
# The dump runs as root through MariaDB's unix socket (no password needed on Debian/Ubuntu).
# The restore test needs Docker for its throwaway database; without Docker it checks that
# the backup decrypts and unpacks completely.
APP_NAME=the shop
HEALTH_PATH=/
WEB_SERVICE=nginx
DB_ENGINE=mariadb
BACKUP_PREFIX=shop-db
JAILS=sshd recidive nginx-limit-req web-probe
