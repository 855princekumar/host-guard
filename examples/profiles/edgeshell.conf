# EdgeShell (github.com/855princekumar/edgeshell): Docker Compose stack with nginx,
# a MariaDB primary and a MariaDB replica (the data lake), privacyIDEA and SenseHive.
#   sudo bash guard/install.sh --profile examples/profiles/edgeshell.conf \
#        --stack-dir /home/ubuntu/edgeshell --domain fleet.example.com --mail-to you@example.com
# The stack folder's own host-hardening.sh is used for SSH and fail2ban.
APP_NAME=EdgeShell
HEALTH_PATH=/healthz
WEB_SERVICE=nginx
DB_ENGINE=mariadb
DB_SERVICE=mariadb
DB_REPLICA=mariadb-lake
BACKUP_PREFIX=edgeshell-db
S3_PREFIX=edgeshell-db/
JAILS=sshd recidive nginx-limit-req edgeshell-probe
# Python packages inside these containers are checked against OSV advisories
CONTAINERS_PYTHON=edgeshell sensehive
# Fleet numbers in the daily report: put a read-only EdgeShell service key in
# /etc/host-guard/.env as EDGESHELL_KEY=...
