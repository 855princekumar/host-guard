name: Release

# A tag vX.Y.Z (equal to VERSION) publishes host-guard to PyPI, but only after every gate:
#   1. the whole CI (tests, lint, Bandit, gitleaks, fresh installs, the lifecycle on three
#      systems, database restores, the red team, the cloud emulators) and CodeQL, on the tag;
#   2. a security audit report for this version, docs/audits/X.Y.Z.md, made with the
#      security-audit skill (github.com/cloudflare/security-audit-skill), with no open
#      confirmed finding;
#   3. VERSION, the tag and the newest CHANGELOG entry agree.
# Publishing uses PyPI Trusted Publishing (OIDC): no token is stored anywhere.
#
# One-time setup on pypi.org, Publishing, "Add a new pending publisher":
#   PyPI project name host-guard, owner 855princekumar, repository host-guard,
#   workflow release.yml, environment pypi.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  codeql:
    name: CodeQL
    uses: ./.github/workflows/codeql.yml
    permissions:
      contents: read
      security-events: write

  gates:
    name: Version, changelog and audit gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: The tag is on main (merged through a pull request with every check)
        run: |
          git fetch -q origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_REF_NAME is not on main"; exit 1; }
      - name: The tag, VERSION and the changelog agree
        run: |
          v="$(cat VERSION)"
          [ "${GITHUB_REF_NAME#v}" = "$v" ] || { echo "tag $GITHUB_REF_NAME, VERSION $v"; exit 1; }
          top="$(grep -m1 -oP '^## \[\K[0-9.]+' CHANGELOG.md)"
          [ "$top" = "$v" ] || { echo "CHANGELOG starts at $top"; exit 1; }
      - name: A security audit of this version with no open confirmed finding
        run: |
          v="$(cat VERSION)"; f="docs/audits/$v.md"
          [ -f "$f" ] || { echo "no $f: run the security-audit skill on this version first (docs/RELEASING.md)"; exit 1; }
          grep -qx "Open confirmed findings: 0" "$f" || { echo "$f does not say 'Open confirmed findings: 0'"; exit 1; }
          echo "audit report: $f"

  build:
    name: Build and check
    needs: [ci, codeql, gates]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build==1.3.0 twine==6.2.0
      - run: python ci/build_dist.py
      - run: twine check --strict dist/*
      - name: The changelog entry for the release notes
        run: |
          awk -v v="$(cat VERSION)" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          test -s notes.md
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: |
            dist/
            notes.md

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/host-guard
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: dist
      - uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e   # v1.13.0
        with:
          packages-dir: dist/

  github:
    name: GitHub release
    needs: pypi
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: dist
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "host-guard ${GITHUB_REF_NAME#v}" --notes-file notes.md
