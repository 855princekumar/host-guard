name: Release

# A tag vX.Y.Z (equal to VERSION) builds the package, tests it, publishes it to PyPI with
# Trusted Publishing (no token stored anywhere: PyPI trusts this workflow through OIDC) and
# attaches the files and the changelog entry to a GitHub release.
#
# One-time setup on pypi.org: Account, Publishing, add a (pending) trusted publisher:
#   owner 855princekumar, repository host-guard, workflow release.yml, environment pypi.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: The tag is the version
        run: |
          [ "${GITHUB_REF_NAME#v}" = "$(cat VERSION)" ] || { echo "tag $GITHUB_REF_NAME, VERSION $(cat VERSION)"; exit 1; }
          top="$(grep -m1 -oP '^## \[\K[0-9.]+' CHANGELOG.md)"
          [ "$top" = "$(cat VERSION)" ] || { echo "CHANGELOG starts at $top"; exit 1; }
      - run: pip install pytest==8.4.2 build==1.3.0 twine==6.2.0
      - run: python -m pytest -q tests guard/tests panel/tests
      - run: python ci/build_dist.py
      - run: twine check --strict dist/*
      - name: The changelog entry for the release notes
        run: |
          awk -v v="$(cat VERSION)" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          test -s notes.md
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: |
            dist/
            notes.md

  lifecycle:
    name: Lifecycle (${{ matrix.os }})
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        os: ["ubuntu:24.04", "ubuntu:26.04", "debian:12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v6
        with:
          name: dist
      - run: docker run --rm -v "$PWD:/src:ro" -v "$PWD/dist:/dist:ro" ${{ matrix.os }} bash /src/ci/lifecycle.sh

  pypi:
    name: Publish to PyPI
    needs: lifecycle
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/host-guard
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: dist
      - uses: pypa/gh-action-pypi-publish@v1.13.0
        with:
          packages-dir: dist/

  github:
    name: GitHub release
    needs: pypi
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: dist
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "host-guard ${GITHUB_REF_NAME#v}" --notes-file notes.md
