name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest==8.4.2
      - run: python -m pytest -q guard/tests panel/tests

  bandit:
    name: Security lint (Bandit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install bandit==1.8.6
      - run: bandit -r guard panel -x guard/tests,panel/tests -ll

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.0 git /repo --no-banner --redact -v

  fresh-install:
    name: Fresh install (${{ matrix.os }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        os: ["ubuntu:24.04", "ubuntu:26.04", "debian:12"]
    steps:
      - uses: actions/checkout@v7
      - run: docker run --rm -v "$PWD:/src:ro" ${{ matrix.os }} bash /src/ci/fresh_install.sh

  databases:
    name: Database backups and restore tests (MariaDB, PostgreSQL)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: bash ci/db_restore.sh

  docs:
    name: Docs and text
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: No em dash anywhere
        run: |
          if git grep -nIP '\x{2014}' -- . ':!*.png' ':!*.webp' ':!*.mp4'; then echo "em dash found (use a colon, comma or parentheses)"; exit 1; fi
      - name: Every local link in the docs exists
        run: python3 ci/check_links.py

  shell:
    name: Shell scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: |
          files="guard/install.sh guard/conf/firewall.sh guard/conf/base-hardening.sh panel/install.sh ci/fresh_install.sh ci/db_restore.sh"
          for f in $files; do bash -n "$f"; done
          shellcheck -S error $files

  units:
    name: systemd units
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: |
          sudo install -m 0755 guard/hostguard.py /usr/local/sbin/hostguard
          sudo install -m 0755 guard/conf/firewall.sh /usr/local/sbin/host-guard-firewall
          sudo install -D -m 0644 panel/hgpanel.py /usr/local/lib/host-guard-panel/hgpanel.py
          getent passwd hgpanel || sudo useradd --system --no-create-home hgpanel
          systemd-analyze verify guard/systemd/*.service panel/systemd/*.service
          systemd-analyze security --offline=true --threshold=20 panel/systemd/host-guard-panel.service
