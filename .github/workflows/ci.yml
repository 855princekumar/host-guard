name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:      # the release runs all of it before publishing
  schedule:
    - cron: '23 1 * * *'   # nightly: everything again against today's images and feeds, longer fuzzing, ZAP
  workflow_dispatch:

permissions:
  contents: read

# bash -eo pipefail: a failing check piped into tee fails its step (audit 0.3.1)
defaults:
  run:
    shell: bash

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest==8.4.2
      - run: python -m pytest -q tests guard/tests panel/tests
        env:
          FUZZ_N: ${{ github.event_name == 'schedule' && '5000' || '300' }}

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7
        with:
          python-version: "3.12"
      - run: pip install ruff==0.14.5
      - run: ruff check --output-format github .

  bandit:
    name: Security lint (Bandit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7
        with:
          python-version: "3.12"
      - run: pip install bandit==1.8.6
      - run: bandit -r guard panel src -x guard/tests,panel/tests -ll

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.0 git /repo --no-banner --redact -v

  fresh-install:
    name: Fresh install (${{ matrix.os }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu:24.04", "ubuntu:26.04", "debian:12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
      - run: docker run --rm -v "$PWD:/src:ro" ${{ matrix.os }} bash /src/ci/fresh_install.sh

  package:
    name: Package (contents, no drift, RECORD, reproducible, smoke, tamper refused)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7
        with:
          python-version: "3.12"
      - name: VERSION matches the newest CHANGELOG entry
        run: |
          v="$(cat VERSION)"; top="$(grep -m1 -oP '^## \[\K[0-9.]+' CHANGELOG.md)"
          [ "$v" = "$top" ] || { echo "VERSION $v, CHANGELOG $top"; exit 1; }
      - run: pip install build==1.3.0 twine==6.2.0
      - name: Build (time stamps from the commit, so anyone can rebuild it bit for bit)
        run: SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" python ci/build_dist.py
      - run: twine check --strict dist/*
      - name: Audit the package (ci/package_audit.py)
        run: SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" python ci/package_audit.py --rebuild --smoke | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Secret scan of everything the package carries
        run: |
          mkdir -p /tmp/unpacked && python -m zipfile -e dist/*.whl /tmp/unpacked/wheel && tar -xzf dist/*.tar.gz -C /tmp/unpacked
          docker run --rm -v /tmp/unpacked:/scan:ro ghcr.io/gitleaks/gitleaks:v8.24.0 dir /scan --no-banner --redact
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4   # v5
        with:
          name: dist
          path: dist/

  lifecycle:
    name: Install, upgrade, rollback, uninstall (${{ matrix.os }})
    needs: package
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu:24.04", "ubuntu:26.04", "debian:12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8.0.2
        with:
          name: dist
          path: dist
      - run: docker run --rm -v "$PWD:/src:ro" -v "$PWD/dist:/dist:ro" ${{ matrix.os }} bash /src/ci/lifecycle.sh

  redteam:
    name: Red team (real attacks on an isolated network)
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8.0.2
        with:
          name: dist
          path: dist
      - run: bash ci/redteam/run.sh
        env:
          ZAP: ${{ github.event_name == 'schedule' && '1' || '0' }}   # OWASP ZAP baseline of the panel, nightly
      - if: always()
        run: cat redteam-out/REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4   # v5
        with:
          name: redteam-report
          path: redteam-out/

  clouds:
    name: Clouds (AWS, Google Cloud, Azure, Oracle Cloud, bare metal; emulated)
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8.0.2
        with:
          name: dist
          path: dist
      - run: bash ci/clouds/run.sh
      - if: always()
        run: cat clouds-out/results.md >> "$GITHUB_STEP_SUMMARY"

  databases:
    name: Database backups and restore tests (MariaDB, PostgreSQL)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
      - run: bash ci/db_restore.sh

  docs:
    name: Docs and text
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
        with:
          fetch-depth: 0
      - name: No em dash anywhere
        run: |
          if git grep -nIP '\x{2014}' -- . ':!*.png' ':!*.webp' ':!*.mp4'; then echo "em dash found (use a colon, comma or parentheses)"; exit 1; fi
      - name: No private names (terms kept only in the FORBIDDEN_TERMS secret; skipped without it)
        env:
          TERMS: ${{ secrets.FORBIDDEN_TERMS }}
        run: |
          [ -n "$TERMS" ] || { echo "no FORBIDDEN_TERMS secret: skipped"; exit 0; }
          hit=0
          while IFS= read -r t; do
            t="$(printf %s "$t" | tr -d "\r" | xargs)"; [ -n "$t" ] || continue
            if git grep -qiIF -- "$t" -- . ; then echo "a private term is in the tree (not printed)"; hit=1; fi
            if git log --format=%B | grep -qiF -- "$t"; then echo "a private term is in a commit message (not printed)"; hit=1; fi
          done < <(printf %s "$TERMS" | tr "," "\n")
          exit $hit
      - name: Every local link in the docs exists
        run: python3 ci/check_links.py

  shell:
    name: Shell scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
      - run: |
          files="host-guard guard/install.sh guard/conf/firewall.sh guard/conf/base-hardening.sh panel/install.sh ci/fresh_install.sh ci/db_restore.sh ci/lifecycle.sh ci/redteam/run.sh ci/redteam/target.sh ci/clouds/run.sh"
          for f in $files; do bash -n "$f"; done
          shellcheck -S error $files

  units:
    name: systemd units
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
      - run: |
          sudo install -m 0755 guard/hostguard.py /usr/local/sbin/hostguard
          sudo install -m 0755 guard/conf/firewall.sh /usr/local/sbin/host-guard-firewall
          sudo install -D -m 0644 panel/hgpanel.py /usr/local/lib/host-guard-panel/hgpanel.py
          getent passwd hgpanel || sudo useradd --system --no-create-home hgpanel
          systemd-analyze verify guard/systemd/*.service panel/systemd/*.service
          systemd-analyze security --offline=true --threshold=20 panel/systemd/host-guard-panel.service
